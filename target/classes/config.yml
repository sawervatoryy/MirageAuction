#
# Файлы плагина:
#   config.yml   — настройки, темы, анимации, звуки (этот файл)
#   messages.yml — все сообщения чата
#   gui.yml      — меню: кнопки, категории, лор лотов, заголовки
#
# Цвета везде: &a-&f, &l, &#RRGGBB, <gradient:#A:#B>текст</gradient>,
# плейсхолдеры темы {primary} {secondary} {accent} {dark} {success} {error}
# и градиент темы {grad:ТЕКСТ} / {gradb:ТЕКСТ} (жирный).

# ───────────────────────── ЦВЕТОВАЯ ТЕМА ─────────────────────────
# Активная тема. Можно менять командой /ah theme <имя> (без перезапуска).
